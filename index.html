document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\">selon la zone<\/span><\/div>\n        <\/div>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:20px;\">\n          <sc-for list=\"{{ drainZones }}\" as=\"z\" hint-placeholder-count=\"4\">\n            <div data-reveal=\"1\" style=\"display:flex; flex-direction:column; gap:14px; padding:14px 14px 24px; background:#F8F8F6; border-radius:24px; box-shadow:0 10px 30px -18px rgba(42,28,23,0.25); transition:transform .4s ease;\" style-hover=\"transform:translateY(-6px);\">\n              <div style=\"aspect-ratio:4/3; background:#EFCCC8; border-radius:16px; display:flex; align-items:center; justify-content:center; color:#792F14; font-size:12px; letter-spacing:0.08em;\">Photo \u00e0 venir<\/div>\n              <span style=\"padding:0 10px; font-family:'Fraunces',Georgia,serif; font-weight:500; font-variation-settings:'SOFT' 100; font-size:22px; line-height:1.25; color:#2A1C17;\">{{ z }}<\/span>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section aria-label=\"S\u00e9ances et formation\" style=\"padding:clamp(72px,10vw,140px) 0 clamp(56px,7vw,96px);\">\n      <div style=\"max-width:1200px; margin:0 auto; padding:0 clamp(20px,4vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:28px;\">\n        <div data-reveal=\"1\" style=\"display:flex; flex-direction:column; gap:16px; padding:clamp(28px,4vw,44px); background:#F8F8F6; border-radius:24px; box-shadow:0 10px 30px -18px rgba(121,47,20,0.25);\">\n          <p style=\"margin:0; font-weight:500; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#792F14;\">03 \u00b7 Le rythme<\/p>\n          <h2 style=\"margin:0; font-family:'Fraunces',Georgia,serif; font-weight:500; font-variation-settings:'SOFT' 100; font-size:clamp(26px,2.4vw,32px); line-height:1.2; color:#2A1C17;\">Combien de <em style=\"font-style:italic; color:#DF5A55;\">s\u00e9ances<\/em>&nbsp;?<\/h2>\n          <p style=\"margin:0; font-size:17px; line-height:1.7; text-wrap:pretty;\">La sensation de l\u00e9g\u00e8ret\u00e9 se ressent souvent d\u00e8s la premi\u00e8re s\u00e9ance. Pour des effets plus durables, une cure de quelques s\u00e9ances rapproch\u00e9es peut \u00eatre propos\u00e9e&nbsp;: nous en parlons ensemble, selon vos besoins et vos objectifs.<\/p>\n          <a href=\"#journal/combien-de-seances\" style=\"align-self:flex-start; margin-top:6px; font-weight:500; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:#792F14; text-decoration:none;\" style-hover=\"color:#DF5A55;\">Lire l'article \u2192<\/a>\n        <\/div>\n        <div data-reveal=\"1\" style=\"display:flex; flex-direction:column; gap:16px; padding:clamp(28px,4vw,44px); background:#F8F8F6; border-radius:24px; box-shadow:0 10px 30px -18px rgba(121,47,20,0.25);\">\n          <p style=\"margin:0; font-weight:500; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:#792F14;\">04 \u00b7 Formation<\/p>\n          <div style=\"display:flex; gap:18px; align-items:flex-start;\">\n            <span style=\"flex:none; width:56px; height:56px; border-radius:50%; background:#FBC0C6; display:flex; align-items:center; justify-content:center;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"26\" height=\"26\" aria-hidden=\"true\" style=\"fill:none; stroke:#792F14; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;\"><circle cx=\"12\" cy=\"9\" r=\"5\"><\/circle><path d=\"M9 13.5 8 21l4-2 4 2-1-7.5\"><\/path><\/svg><\/span>\n            <p style=\"margin:0; font-family:'Fraunces',Georgia,serif; font-weight:500; font-variation-settings:'SOFT' 100; font-size:clamp(22px,2.2vw,26px); line-height:1.35; color:#2A1C17; text-wrap:pretty;\">Form\u00e9e \u00e0 la m\u00e9thode Renata Fran\u00e7a (SPA Renata Fran\u00e7a, 2025).<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/sc-if>\n\n  <sc-if value=\"{{ isCupping }}\" hint-placehold  'avis-resultats': { tab: 'Avis & r\u00e9sultats', label: 'Avis & r\u00e9sultats', pre: 'Vos ', em: 'retours', post: '', crumbs: [['Avis & r\u00e9sultats', '#avis-resultats']], nextTitle: '\u00c0 votre tour', next: ['drainage', 'rdv'] },\n  'rendez-vous': { tab: 'Rendez-vous', label: 'Rendez-vous', pre: 'Prendre ', em: 'rendez-vous', post: '', health: true, doctolib: true, crumbs: [['Rendez-vous', '#rendez-vous']], nextTitle: 'Avant de venir', next: ['cabinets', 'journal'], intro: 'Je vous accueille \u00e0 Amb\u00e9rieu-en-Bugey ou \u00e0 Mirabel. R\u00e9servez votre s\u00e9ance en ligne, en quelques clics.' }\n};\nconst CATS = { osteo: 'Ost\u00e9opathie', drainage: 'Drainage lymphatique', cupping: 'Cupping', tracas: 'Tracas du quotidien' };\nconst ART_LIST = [\n  { slug: 'drainage-lymphatique', title: \"Qu'est-ce que le drainage lymphatique ?\", cat: 'drainage', read: '5 min', soin: 'drainage', related: ['combien-de-seances', 'types-de-cellulite'],\n    sections: [\n      { h: 'Le syst\u00e8me lymphatique, en quelques mots', ps: [\"Le syst\u00e8me lymphatique est un r\u00e9seau de vaisseaux et de ganglions qui accompagne la circulation sanguine. Il transporte la lymphe, un liquide qui contribue \u00e0 \u00e9vacuer l'exc\u00e8s d'eau et certains d\u00e9chets des tissus, et participe aux d\u00e9fenses de l'organisme.\", \"Contrairement au sang, pouss\u00e9 par le c\u0153ur, la lymphe circule surtout gr\u00e2ce aux mouvements du corps et \u00e0 la respiration. La s\u00e9dentarit\u00e9, la chaleur ou de longues stations debout peuvent ralentir cette circulation et donner une sensation de jambes lourdes ou de gonflement.\"] },\n      { h: 'Ce que fait le drainage', ps: [\"Le drainage lymphatique est un massage manuel qui accompagne le trajet naturel de la lymphe vers les ganglions. Il peut aider \u00e0 relancer la circulation et procure souvent une sensation de l\u00e9g\u00e8ret\u00e9 et de d\u00e9gonflement apr\u00e8s la s\u00e9ance.\"] },\n      { h: 'La m\u00e9thode Renata Fran\u00e7a', ps: [\"D\u00e9velopp\u00e9e par la Br\u00e9silienne Renata Fran\u00e7a, cette m\u00e9thode se distingue par des gestes toniques, rythm\u00e9s et pr\u00e9cis, avec une pression plus soutenue qu'un drainage classique. Elle associe le drainage \u00e0 un travail de modelage de la silhouette.\"] },\n      { h: 'Les bienfaits recherch\u00e9s', ps: [\"Une sensation de jambes plus l\u00e9g\u00e8res, un ventre qui para\u00eet moins gonfl\u00e9, une silhouette plus dessin\u00e9e et un vrai moment de bien-\u00eatre. Les ressentis varient d'une personne \u00e0 l'autre et d\u00e9pendent aussi de l'hygi\u00e8ne de vie.\"] },\n      { h: \"Le d\u00e9roul\u00e9 d'une s\u00e9ance\", ps: [\"Nous commen\u00e7ons par un \u00e9change sur vos attentes et votre sant\u00e9, puis je r\u00e9alise le massage sur la zone choisie. Pensez \u00e0 bien vous hydrater apr\u00e8s la s\u00e9ance : une envie plus fr\u00e9quente d'uriner est courante.\"] }\n    ],\n    retenir: [\"La lymphe circule gr\u00e2ce au mouvement : bouger au quotidien l'aide d\u00e9j\u00e0.\", \"La m\u00e9thode Renata Fran\u00e7a utilise des gestes toniques et rythm\u00e9s.\", \"Les sensations varient d'une personne \u00e0 l'autre.\"],\n    medecin: [\"gonflement soudain, douloureux ou d'une seule jambe\", \"rougeur ou chaleur au niveau d'un membre\", \"ant\u00e9c\u00e9dents de phl\u00e9bite, de probl\u00e8me cardiaque ou r\u00e9nal, ou cancer en cours de traitement\", \"grossesse : demandez l'accord de votre m\u00e9decin ou de votre sage-femme\"] },\n  { slug: 'combien-de-seances', title: 'Combien de s\u00e9ances de drainage faut-il ?', cat: 'drainage', read: '4 min', soin: 'drainage', related: ['drainage-lymphatique', 'types-de-cellulite'],\n    sections: [\n      { h: 'Une premi\u00e8re s\u00e9ance pour d\u00e9couvrir', ps: [\"D\u00e8s la premi\u00e8re s\u00e9ance, beaucoup de personnes d\u00e9crivent une sensation de l\u00e9g\u00e8ret\u00e9. C'est aussi l'occasion de faire le point ensemble sur vos attentes et de d\u00e9finir un rythme adapt\u00e9.\"] },\n      { h: 'Le protocole classique', ps: [\"Pour des effets plus durables, on propose g\u00e9n\u00e9ralement une cure de plusieurs s\u00e9ances rapproch\u00e9es, par exemple une \u00e0 deux par semaine pendant quelques semaines. Le nombre exact d\u00e9pend de vos objectifs, de la zone travaill\u00e9e et de votre ressenti.\"] },\n      { h: 'Puis un entretien', ps: [\"Une fois la cure termin\u00e9e, des s\u00e9ances plus espac\u00e9es, par exemple une fois par mois, peuvent aider \u00e0 entretenir les sensations obtenues.\"] },\n      { h: 'Pourquoi la r\u00e9gularit\u00e9 compte', ps: [\"Le drainage accompagne un fonctionnement naturel du corps : il agit mieux quand il est r\u00e9p\u00e9t\u00e9. La r\u00e9gularit\u00e9, associ\u00e9e \u00e0 une bonne hydratation, \u00e0 l'activit\u00e9 physique et \u00e0 une alimentation \u00e9quilibr\u00e9e, contribue \u00e0 prolonger les effets ressentis.\"] }\n    ],\n    retenir: [\"Une sensation de l\u00e9g\u00e8ret\u00e9 est souvent ressentie d\u00e8s la premi\u00e8re s\u00e9ance.\", \"Une cure de s\u00e9ances rapproch\u00e9es, puis un entretien plus espac\u00e9.\", \"Le rythme est toujours adapt\u00e9 \u00e0 vous.\"],\n    medecin: [\"jambes gonfl\u00e9es de fa\u00e7on persistante ou qui s'aggrave\", \"douleur, rougeur ou chaleur dans un mollet\", \"essoufflement inhabituel associ\u00e9 \u00e0 des gonflements\"] },\n  { slug: 'types-de-cellulite', title: 'Les 3 types de cellulite', cat: 'drainage', read: '5 min', soin: 'drainage', related: ['drainage-lymphatique', 'combien-de-seances'],\n    sections: [\n      { h: 'Un ph\u00e9nom\u00e8ne tr\u00e8s courant', ps: [\"La cellulite concerne une grande majorit\u00e9 de femmes, quel que soit leur poids. Elle est li\u00e9e \u00e0 la fa\u00e7on dont les cellules graisseuses, l'eau et les fibres s'organisent sous la peau. On en distingue souvent trois formes, qui peuvent coexister.\"] },\n      { h: 'La cellulite adipeuse', ps: [\"Plut\u00f4t souple et indolore, elle est li\u00e9e au stockage des graisses. On la rep\u00e8re en pin\u00e7ant la peau, qui prend alors un aspect \u00ab peau d'orange \u00bb. Elle est souvent influenc\u00e9e par l'alimentation et la s\u00e9dentarit\u00e9.\"] },\n      { h: 'La cellulite aqueuse', ps: [\"Li\u00e9e \u00e0 la r\u00e9tention d'eau, elle s'accompagne d'une sensation de gonflement et de jambes lourdes, souvent plus marqu\u00e9e en fin de journ\u00e9e ou par temps chaud. Une circulation ralentie peut y contribuer.\"] },\n      { h: 'La cellulite fibreuse', ps: [\"Plus ancienne et plus ferme, elle peut \u00eatre sensible au toucher. Les fibres autour des cellules graisseuses se sont durcies, ce qui la rend plus difficile \u00e0 faire \u00e9voluer.\"] },\n      { h: 'Ce qui peut aider', ps: [\"Bouger r\u00e9guli\u00e8rement, bien s'hydrater et limiter le sel sont de bons alli\u00e9s. Le drainage lymphatique peut aider \u00e0 relancer la circulation, notamment en cas de cellulite aqueuse, et contribue \u00e0 une sensation de peau plus lisse. Les r\u00e9sultats varient d'une personne \u00e0 l'autre.\"] }\n    ],\n    retenir: [\"Trois formes : adipeuse, aqueuse et fibreuse, souvent m\u00eal\u00e9es.\", \"Le mouvement et l'hydratation restent la base.\", \"Le drainage peut aider, surtout en cas de r\u00e9tention d'eau.\"],\n    medecin: [\"gonflement brutal ou d'une seule jambe\", \"zones douloureuses, rouges ou chaudes\", \"prise de poids rapide et inexpliqu\u00e9e\"] },\n  { slug: 'osteopathie-quand-consulter', title: 'Ost\u00e9opathie : quand consulter ?', cat: 'osteo', read: '5 min', soin: 'osteopathie', related: ['dos-courbe', 'reveils-difficiles'],\n    sections: [\n      { h: 'Les motifs fr\u00e9quents', ps: [\"On consulte souvent un ost\u00e9opathe pour des douleurs de dos ou de nuque, des tensions li\u00e9es au stress, des maux de t\u00eate, les suites d'une entorse ou des r\u00e8gles douloureuses. L'ost\u00e9opathie peut aussi aider en cas de troubles du sommeil li\u00e9s aux tensions.\"] },\n      { h: '\u00c0 chaque \u00e2ge, une approche adapt\u00e9e', ps: [\"Chez le nourrisson, des gestes tr\u00e8s doux peuvent accompagner les inconforts des premiers mois. Chez l'enfant, la s\u00e9ance s'adapte \u00e0 sa croissance. Pendant la grossesse, l'ost\u00e9opathie peut aider le corps \u00e0 s'adapter \u00e0 ses changements.\", \"Les sportifs consultent pour pr\u00e9parer l'effort ou mieux r\u00e9cup\u00e9rer, et les seniors pour garder de la mobilit\u00e9 et soulager les raideurs.\"] },\n      { h: 'Consulter aussi en pr\u00e9vention', ps: [\"Il n'est pas n\u00e9cessaire d'avoir mal pour consulter. Un bilan apr\u00e8s un changement de rythme de vie, une reprise du sport ou une naissance peut aider \u00e0 rep\u00e9rer des tensions avant qu'elles ne s'installent.\"] },\n      { h: \"Ce que l'ost\u00e9opathie ne remplace pas\", ps: [\"L'ost\u00e9opathe travaille en compl\u00e9ment du suivi m\u00e9dical, jamais \u00e0 sa place. En cas de doute, je vous oriente vers votre m\u00e9decin.\"] }\n    ],\n    retenir: [\"Douleurs, tensions, stress : les motifs de consultation sont vari\u00e9s.\", \"Une approche adapt\u00e9e \u00e0 chaque \u00e2ge, du nourrisson au senior.\", \"On peut aussi consulter en pr\u00e9vention.\"],\n    medecin: [\"douleur apr\u00e8s un choc ou une chute importante\", \"fi\u00e8vre associ\u00e9e \u00e0 des douleurs\", \"fourmillements, perte de force ou de sensibilit\u00e9\", \"chez le nourrisson : fi\u00e8vre, refus de s'alimenter ou pleurs inhabituels\"] },\n  { slug: 'dos-courbe', title: 'Dos courb\u00e9 au quotidien : comprendre et soulager', cat: 'tracas', read: '4 min', soin: 'osteopathie', related: ['reveils-difficiles', 'cupping'],\n    sections: [\n      { h: \"Ce qui se passe devant l'\u00e9cran\", ps: [\"Assis de longues heures, on a tendance \u00e0 avancer la t\u00eate, arrondir le haut du dos et enrouler les \u00e9paules. Les muscles de la nuque et du dos travaillent alors en continu pour soutenir cette position.\"] },\n      { h: \"Des tensions qui s'installent\", ps: [\"Au fil des jours, cette posture peut entra\u00eener des raideurs, des douleurs entre les omoplates, des maux de t\u00eate ou une sensation de fatigue en fin de journ\u00e9e.\"] },\n      { h: 'Des gestes simples au quotidien', ps: [\"Placez le haut de l'\u00e9cran \u00e0 hauteur des yeux, gardez les pieds \u00e0 plat et levez-vous quelques minutes toutes les heures. Quelques \u00e9tirements doux de la nuque et des \u00e9paules, et une respiration ample, aident \u00e0 rel\u00e2cher les tensions.\"] },\n      { h: 'Ce que l\u2019ost\u00e9opathie et les ventouses peuvent apporter', ps: [\"L'ost\u00e9opathie peut aider \u00e0 redonner de la mobilit\u00e9 au dos et \u00e0 soulager les tensions. Associ\u00e9es \u00e0 la s\u00e9ance, les ventouses peuvent contribuer \u00e0 d\u00e9tendre les muscles profonds et procurer une sensation de rel\u00e2chement.\"] }\n    ],\n    retenir: [\"La posture devant l'\u00e9cran sollicite en continu la nuque et le dos.\", \"\u00c9cran \u00e0 hauteur des yeux et pauses r\u00e9guli\u00e8res font la diff\u00e9rence.\", \"Ost\u00e9opathie et ventouses peuvent aider \u00e0 rel\u00e2cher les tensions.\"],\n    medecin: [\"douleur qui descend dans le bras ou la jambe\", \"fourmillements ou perte de force\", \"douleur qui r\u00e9veille la nuit ou s'accompagne de fi\u00e8vre\"] },\n  { slug: 'reveils-difficiles', title: 'R\u00e9veils difficiles : quand le corps est tendu', cat: 'tracas', read: '4 min', soin: 'osteopathie', related: ['dos-courbe', 'osteopathie-quand-consulter'],\n    sections: [\n      { h: 'Les raideurs du matin', ps: [\"Se r\u00e9veiller le dos ou la nuque raides est fr\u00e9quent. Pendant la nuit, on bouge peu : les muscles et les articulations ont besoin de quelques minutes pour se remettre en mouvement.\"] },\n      { h: 'Le r\u00f4le du sommeil', ps: [\"Une literie inadapt\u00e9e, un oreiller trop haut ou une position fig\u00e9e peuvent entretenir les tensions. \u00c0 l'inverse, un sommeil de mauvaise qualit\u00e9 rend le corps plus sensible \u00e0 la douleur.\"] },\n      { h: \"Quand le stress s'en m\u00eale\", ps: [\"Le stress peut se loger dans la m\u00e2choire, la nuque ou les \u00e9paules, parfois m\u00eame pendant le sommeil. On se r\u00e9veille alors fatigu\u00e9, avec la sensation de ne pas avoir r\u00e9cup\u00e9r\u00e9.\"] },\n      { h: 'Quelques conseils simples', ps: [\"Au r\u00e9veil, prenez deux minutes pour vous \u00e9tirer doucement dans le lit. Le soir, ralentissez le rythme : \u00e9crans \u00e9teints plus t\u00f4t, respiration lente, lumi\u00e8re douce. Une s\u00e9ance d'ost\u00e9opathie peut aider \u00e0 rel\u00e2cher les tensions install\u00e9es.\"] }\n    ],\n    retenir: [\"Les raideurs du matin sont fr\u00e9quentes et souvent passag\u00e8res.\", \"Literie, position et stress jouent un r\u00f4le.\", \"Quelques \u00e9tirements doux au r\u00e9veil peuvent aider.\"],\n    medecin: [\"raideurs qui durent plus d'une heure chaque matin\", \"articulations gonfl\u00e9es ou chaudes\", \"fatigue intense et persistante, ou ronflements avec pauses respiratoires\"] },\n  { slug: 'cupping', title: 'Le cupping, comment \u00e7a marche ?', cat: 'cupping', read: '4 min', soin: 'cupping', related: ['dos-courbe', 'osteopathie-quand-consulter'],\n    sections: [\n      { h: 'Le principe des ventouses', ps: [\"Le cupping consiste \u00e0 poser des ventouses sur la peau. Elles cr\u00e9ent une l\u00e9g\u00e8re aspiration qui soul\u00e8ve la peau et les tissus situ\u00e9s en dessous, \u00e0 l'inverse d'un massage qui appuie.\"] },\n      { h: 'Les sensations pendant la s\u00e9ance', ps: [\"On ressent une aspiration et un tiraillement, parfois intenses mais rarement douloureux. Les ventouses peuvent rester fixes ou \u00eatre d\u00e9plac\u00e9es doucement. Je m'adapte toujours \u00e0 votre ressenti.\"] },\n      { h: 'Les marques temporaires', ps: [\"Les ventouses peuvent laisser des marques rondes, plus ou moins color\u00e9es. Ce ne sont pas des bleus li\u00e9s \u00e0 un choc : elles disparaissent en quelques jours.\"] },\n      { h: 'Pour qui ?', ps: [\"Le cupping s'adresse notamment aux sportifs, aux personnes qui ont des tensions du dos et des \u00e9paules, ou qui souhaitent favoriser leur r\u00e9cup\u00e9ration musculaire. Il peut \u00eatre associ\u00e9 \u00e0 une s\u00e9ance d'ost\u00e9opathie.\"] }\n    ],\n    retenir: [\"Les ventouses aspirent la peau au lieu d'appuyer.\", \"Des marques rondes temporaires sont normales.\", \"Le cupping peut compl\u00e9ter une s\u00e9ance d'ost\u00e9opathie.\"],\n    medecin: [\"maladie de peau, plaie ou fragilit\u00e9 cutan\u00e9e\", \"traitement anticoagulant ou trouble de la coagulation\", \"grossesse : parlez-en avant la s\u00e9ance\"] }\n];\nconst ARTICLES = {}, ART_BY = {};\nART_LIST.forEach(a => { ARTICLES[a.slug] = a.title; ART_BY[a.slug] = a; });\nconst ALIASES = { 'dos-courbe-ecran': 'dos-courbe', 'jambes-lourdes': 'drainage-lymphatique', 'stress-tensions-nuque': 'cupping', 'qu-est-ce-que-le-drainage-lymphatique': 'drainage-lymphatique', 'les-3-types-de-cellulite': 'types-de-cellulite', 'drainage-combien-de-seances': 'combien-de-seances', 'cupping-comment-ca-marche': 'cupping' };\nconst artCard = (slug) => { const a = ART_BY[slug]; return { href: '#journal/' + a.slug, title: a.title, cat: CATS[a.cat], read: a.read }; };\nconst SOIN_CARDS = { osteopathie: { t: 'Ost\u00e9opathie', d: 'Une approche manuelle douce et globale pour soulager tensions, d\u00e9s\u00e9quilibres et douleurs.', href: '#osteopathie' }, drainage: { t: 'Drainage lymphatique', d: 'M\u00e9thode Renata Fran\u00e7a : un massage tonique pour retrouver une sensation de l\u00e9g\u00e8ret\u00e9.', href: '#drainage-lymphatique' }, cupping: { t: 'Cupping th\u00e9rapie', d: 'La synergie des ventouses pour d\u00e9nouer les tensions musculaires profondes.', href: '#cupping' } };\nconst FILTERS = [['all', 'Tous'], ['osteo', 'Ost\u00e9opathie'], ['drainage', 'Dra
